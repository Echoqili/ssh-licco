name: Publish to PyPI & MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-docs-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.changes }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.MCP_GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install build twine
        pip install -e ".[dev]"

    - name: Sync docs
      run: python scripts/sync_docs.py

    - name: Check for changes
      id: check-changes
      run: |
        git add -u
        if git diff --staged --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push updates
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git commit -m "chore: update documentation for release"
        git push

    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false

  publish-mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: update-docs-and-publish
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Publish to MCP Registry
      env:
        GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
      run: |
        python scripts/publish_mcp_registry.py
      continue-on-error: true
