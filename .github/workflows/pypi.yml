name: Publish to PyPI & MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.changes }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.MCP_GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install build twine
        pip install -e ".[dev]"

    - name: Sync docs
      run: python scripts/sync_docs.py

    - name: Check for changes
      id: check-changes
      run: |
        git add -u
        if git diff --staged --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push updates
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git checkout master
        git pull origin master --rebase
        git commit -m "chore: update documentation for release"
        git push origin master

    - name: Build package
      run: python -m build
    
    - name: Check PyPI version
      id: check-pypi
      run: |
        VERSION=$(python -c "from pathlib import Path; print(Path('VERSION').read_text().strip())")
        echo "Checking PyPI for version $VERSION..."
        if curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/ssh-licco/$VERSION/json" | grep -q "200"; then
          echo "skip_publish=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION already exists on PyPI, skipping publish."
        else
          echo "skip_publish=false" >> $GITHUB_OUTPUT
          echo "Version $VERSION not found on PyPI, will publish."
        fi

    - name: Publish to PyPI
      if: steps.check-pypi.outputs.skip_publish != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false

  publish-mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: update-docs-and-publish
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Publish to MCP Registry
      env:
        GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
      run: |
        python scripts/publish_mcp_registry.py
      continue-on-error: true
