name: Publish to PyPI & MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      changes_detected: ${{ steps.check-changes.outputs.changes }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.MCP_GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install build twine
        pip install -e ".[dev]"

    - name: Sync docs
      # 仅在非 tag 触发时向 master 回写文档（tag 触发时本地已保证文档同步）
      if: github.ref_type != 'tag'
      run: python scripts/sync_docs.py

    - name: Check for changes
      if: github.ref_type != 'tag'
      id: check-changes
      run: |
        git add -u
        if git diff --staged --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push updates
      if: github.ref_type != 'tag' && steps.check-changes.outputs.changes == 'true'
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git checkout master
        git commit -m "chore: update documentation for release"
        git pull origin master --rebase
        git push origin master

    - name: Build package
      run: python -m build
    
    - name: Check PyPI version
      id: check-pypi
      run: |
        VERSION=$(python -c "from pathlib import Path; print(Path('VERSION').read_text().strip())")
        echo "Checking PyPI for version $VERSION..."

        # 方法1: PyPI JSON API（带重试，避免缓存/网络波动）
        HTTP_CODE=""
        for i in 1 2 3; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://pypi.org/pypi/ssh-licco/$VERSION/json")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "skip_publish=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on PyPI, skipping publish."
            exit 0
          fi
          if [ "$HTTP_CODE" = "404" ]; then
            break
          fi
          echo "Attempt $i returned HTTP $HTTP_CODE, retrying..."
          sleep 3
        done

        # 方法2: pip index versions 作为交叉验证
        LATEST=$(pip index versions ssh-licco 2>/dev/null | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
        if [ "$LATEST" = "$VERSION" ]; then
          echo "skip_publish=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION found via pip index, skipping publish."
          exit 0
        fi

        echo "skip_publish=false" >> $GITHUB_OUTPUT
        echo "Version $VERSION not found on PyPI, will publish."

    - name: Publish to PyPI
      if: steps.check-pypi.outputs.skip_publish != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false

  publish-mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: update-docs-and-publish
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Publish to MCP Registry
      env:
        GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
      run: |
        python scripts/publish_mcp_registry.py
      continue-on-error: true
