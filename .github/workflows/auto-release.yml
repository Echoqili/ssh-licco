name: Complete verified GitHub Release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      artifact:
        required: true
        type: string
permissions:
  contents: write
jobs:
  complete-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: release-assets
      - name: Create draft or reuse existing release
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > existing-assets.json; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > existing-assets.json
          fi
          for file in release-assets/*; do
            name=$(basename "$file")
            if jq -e --arg name "$name" '.assets | any(.name == $name)' existing-assets.json >/dev/null; then
              echo "Keeping existing immutable asset: $name"
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
      - name: Generate checksums from the actual public assets
        run: |
          mkdir actual-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --pattern '*.tar.gz' --pattern '*.tgz' --dir actual-assets
          python release-control/scripts/release_checks.py checksums --source source --dist actual-assets
          gh release upload "$RELEASE_TAG" actual-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
      - name: Mark verified release public
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          {
            echo '## GitHub Release ready'
            printf '%s\n\n' "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo 'Wheel, source distribution, npm tarball and SHA256SUMS are available. Existing package assets were preserved.'
          } >> "$GITHUB_STEP_SUMMARY"
