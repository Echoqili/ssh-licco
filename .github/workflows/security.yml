name: Security regression checks

on:
  pull_request:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and checks
        run: python -m pip install -e '.[dev]' pip-audit
      - name: Run regression tests
        run: python -m pytest tests -q
      - name: Audit installed dependencies
        run: python -m pip_audit --desc
